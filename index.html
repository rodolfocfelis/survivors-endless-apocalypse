<html lang="pt-BR">
<head>

<style>
:root{--bg:#10131d;--panel:#171d2b;--gold:#f7c66a;--cyan:#70e7df;--muted:#a5b0c7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.stat{background:#111827d9;border:1px solid #ffffff22;border-radius:12px;padding:7px 11px;min-width:74px;box-shadow:0 4px 18px #0005}.stat small{display:block;color:#aebbd0;font-size:10px;letter-spacing:1px}.stat b{font-size:16px}.bars{position:absolute;top:62px;left:14px;right:14px;display:grid;gap:5px}.bar{height:10px;background:#080c14;border:1px solid #ffffff35;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;transition:width .15s}.hp i{background:linear-gradient(90deg,#d7435a,#ff7d70)}.xp i{background:linear-gradient(90deg,#32b8dc,#9af5e9)}#bossbar{display:none;margin-top:2px}#bossbar i{background:linear-gradient(90deg,#9b4de2,#f16bcb)}
#joystick{position:absolute;z-index:4;left:22px;bottom:28px;width:118px;height:118px;border-radius:50%;background:#dce9ff16;border:2px solid #dce9ff44;pointer-events:auto;display:none;touch-action:none;user-select:none;-webkit-user-select:none}#stick{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:linear-gradient(145deg,#b9d8efaa,#56738aaa);border:2px solid #ffffff99;box-shadow:0 3px 12px #0008}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at 50% 25%,#26334d99,#090d17ed);z-index:5;overflow:auto}
.panel{width:min(620px,100%);max-height:100%;overflow:auto;background:linear-gradient(160deg,#202b40f5,#111725f7);border:1px solid #ffffff26;border-radius:22px;padding:24px;box-shadow:0 25px 90px #000a;text-align:center}
.logo{font-weight:1000;letter-spacing:2px;font-size:clamp(28px,7vw,52px);line-height:.98;text-shadow:0 4px 0 #5b294b,0 8px 24px #000}.logo span{color:var(--gold)}.sub{color:#aab7cd;letter-spacing:3px;font-size:11px;margin:12px 0 22px}
button{border:1px solid #ffffff26;border-radius:13px;padding:13px 17px;background:#283750;color:white;font-weight:800;letter-spacing:.5px;font-size:14px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}button.primary{background:linear-gradient(100deg,#e9a94c,#f4d17c);color:#241b16;border:0;box-shadow:0 5px 0 #9d632c;width:100%;font-size:17px;padding:16px;margin:7px 0}
button.secondary{background:#26364e}button:disabled{opacity:.4}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.choice{padding:14px;text-align:left;min-height:130px;background:linear-gradient(145deg,#2a3852,#182235);border:1px solid #ffffff26;border-radius:15px;cursor:pointer}.choice strong{display:block;margin:5px 0;color:#ffe0a1}.choice small{color:#b7c5d8;line-height:1.4}.rarity{font-size:9px;letter-spacing:1.5px;color:#8fe5dc}.muted{color:var(--muted);font-size:12px}.section{margin:16px 0;padding:12px;background:#ffffff08;border-radius:13px;text-align:left}.section h3{margin:0 0 8px;font-size:13px;color:var(--gold)}.section p{margin:5px 0;color:#b9c5d8;font-size:12px}
#toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:#101827dd;border:1px solid #ffffff33;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3;font-weight:800;font-size:12px}
@media(orientation:landscape){.bars{top:58px;left:16px;right:16px;max-width:420px}.panel{padding:18px}.logo{font-size:36px}#joystick{width:108px;height:108px;bottom:18px}#stick{left:28px;top:28px}}
</style></head>
<body>
<canvas id="game"></canvas><div id="toast"></div>
<div id="hud"><div class="top"><div class="stat"><small>VIDA</small><b id="health">100/100</b></div><div class="stat"><small>TEMPO</small><b id="clock">00:00</b></div><div class="stat"><small>NÍVEL</small><b id="level">1</b></div><div class="stat"><small>ELIMINAÇÕES</small><b id="kills">0</b></div></div>
<div class="bars"><div class="bar hp"><i id="hpfill"></i></div><div class="bar xp"><i id="xpfill"></i></div><div id="bossbar" class="bar"><i id="bossfill"></i></div></div></div>
<div id="joystick"><div id="stick"></div></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), canvas=$('game'),ctx=canvas.getContext('2d');
const SAVE='endless_apocalypse_save_v1';
const maps=[{name:'Floresta Amaldiçoada',bg:'#172a29',ground:'#203a32',accent:'#69a77d',desc:'Raízes vivas e névoa espectral.'},{name:'Ruínas do Submundo',bg:'#2a202c',ground:'#40303c',accent:'#c17a67',desc:'Pedras antigas e brasas esquecidas.'},{name:'Reino Congelado',bg:'#182b40',ground:'#29465b',accent:'#8ad9ed',desc:'Tempestades de gelo e silêncio.'}];
const chars=[{name:'Kael, o Errante',hp:110,speed:190,power:1,skill:'Passo espectral',desc:'Mais velocidade e mobilidade.'},{name:'Nyra, Tecelã',hp:85,speed:178,power:1.2,skill:'Pulso arcano',desc:'Dano mágico aumentado.'},{name:'Brann, Sentinela',hp:150,speed:155,power:1,skill:'Pele de pedra',desc:'Vida e resistência superiores.'},{name:'Vex, Caçador',hp:95,speed:185,power:1.08,skill:'Instinto predador',desc:'Críticos mais frequentes.'},{name:'Iria, Oráculo',hp:100,speed:170,power:1.1,skill:'Colheita astral',desc:'Maior alcance de coleta.'}];
const weapons=[
['Espada Espectral','Corte em arco que atinge inimigos próximos',22,1.0,'#8ce8f2'],['Orbe Arcano','Projétil mágico que persegue o alvo',18,1.25,'#bb91ff'],['Machado do Caos','Machados pesados lançados adiante',34,1.65,'#f0a45b'],['Chuva de Meteoros','Impactos em área ao redor do alvo',38,2.8,'#ff805d'],['Correntes Infernais','Correntes que chicoteiam em círculo',14,.75,'#df5875'],['Lança Celestial','Perfura vários inimigos em linha',30,1.5,'#ffe08a'],['Foices Giratórias','Foices orbitais defensivas',16,.7,'#c1f38b'],['Explosão Sombria','Pulso sombrio em área',45,3.5,'#a37ae8'],['Raios Elétricos','Descargas encadeadas',20,1.4,'#7be7ff'],['Arco Elemental','Disparo rápido de energia',15,.85,'#ffb7dc'],['Lâminas Sanguinárias','Lâminas que retornam ao jogador',26,1.2,'#ed5267'],['Portal Dimensional','Fenda que dispara energia',40,2.4,'#8c80ff']];
const passives=[['Amuleto Sombrio','Aumenta dano em 12%', 'damage'],['Botas do Vento','Aumenta velocidade em 10%','speed'],['Coração Antigo','Aumenta vida máxima em 15%','health'],['Ímã Astral','Amplia coleta de cristais','magnet'],['Ampulheta','Reduz recarga em 8%','cooldown'],['Selo da Fortuna','Melhora sorte e críticos','luck'],['Couraça Rúnica','Reduz dano recebido','armor'],['Sangue Vivo','Regenera vida lentamente','regen']];
const enemyTypes=[
['Rastejante','basic',30,48,12,'#9ab66d'],['Cão de Cinzas','fast',22,85,10,'#c18b65'],['Brutamonte','tank',110,28,25,'#9d6871'],['Morcego Oco','flying',20,72,10,'#a98bd1'],['Larva Explosiva','explosive',26,55,20,'#d88c54'],['Cultista','ranged',32,38,12,'#8a9fd0'],['Aranha Carmesim','fast',26,95,13,'#d45d66'],['Golem de Musgo','tank',150,24,28,'#779b83'],['Espectro','flying',42,65,18,'#79c5c6'],['Parasita','basic',45,58,15,'#b7a36b'],['Corvo Abissal','flying',35,100,14,'#727fbb'],['Bomba Viva','explosive',40,60,26,'#d87951'],['Atirador Profano','ranged',50,42,18,'#c38ab0'],['Cavaleiro Caído','elite',220,50,32,'#b7a0a1'],['Devorador','elite',300,35,38,'#8c668a']];
let W=innerWidth,H=innerHeight,dpr=1,scale=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W,H)/720;}
addEventListener('resize',resize);resize();
let save=loadSave(),state='menu',g=null,keys={},joy={x:0,y:0,active:false},last=0,acc=0,selectedHero=0;
function loadSave(){try{return Object.assign({coins:0,unlocks:[0],best:0,totalKills:0,upgrades:{health:0,damage:0,speed:0,luck:0,magnet:0,cooldown:0,armor:0,regen:0},runs:0},JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){return {coins:0,unlocks:[0],best:0,totalKills:0,upgrades:{},runs:0}}}
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){toast('Não foi possível salvar neste navegador')}}
function panel(html){$('panel').innerHTML=html;$('overlay').style.display='flex'}
function hidePanel(){$('overlay').style.display='none'}
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,1500)}
function menu(){state='menu';$('hud').style.display='none';$('joystick').style.display='none';panel(`<div class="logo">SURVIVORS<br><span>ENDLESS APOCALYPSE</span></div><div class="sub">SOBREVIVA À ÚLTIMA NOITE</div><button class="primary" id="play">INICIAR SOBREVIVÊNCIA</button><div class="row"><button id="heroes">PERSONAGENS</button><button id="upgrade">MELHORIAS</button><button id="records">REGISTROS</button></div><div class="section"><h3>ARSENAL & AMEAÇAS</h3><p>12 armas • 15 criaturas • 3 regiões • Chefe apocalíptico</p><p>Moedas: <b style="color:#f7c66a">${save.coins}</b> · Melhor sobrevivência: ${fmt(save.best)}</p></div><div class="muted">Salvamento automático ativado · Toque para iniciar áudio</div>`);$('play').onclick=selectMap;$('heroes').onclick=heroMenu;$('upgrade').onclick=upgradeMenu;$('records').onclick=recordMenu}
function selectMap(){panel(`<h2>ESCOLHA SEU DESTINO</h2><div class="section"><h3>PERSONAGEM</h3><div class="row">${chars.map((c,i)=>`<button data-pickhero="${i}" ${!save.unlocks.includes(i)?'disabled':''} style="${selectedHero===i?'border-color:#f7c66a;color:#f7c66a':''}">${c.name.split(',')[0]}</button>`).join('')}</div></div><div class="cards">${maps.map((m,i)=>`<div class="choice" data-map="${i}"><strong>${m.name}</strong><small>${m.desc}</small></div>`).join('')}</div><button id="back">VOLTAR</button>`);document.querySelectorAll('[data-pickhero]').forEach(e=>e.onclick=()=>{selectedHero=+e.dataset.pickhero;selectMap()});document.querySelectorAll('[data-map]').forEach(e=>e.onclick=()=>startGame(+e.dataset.map,selectedHero));$('back').onclick=menu}
function heroMenu(){panel(`<h2>PERSONAGENS</h2><div class="cards">${chars.map((c,i)=>`<div class="choice" data-hero="${i}"><div class="rarity">${save.unlocks.includes(i)?'DESBLOQUEADO':`DESBLOQUEIO · ${[0,300,500,700,900][i]} MOEDAS`}</div><strong>${c.name}</strong><small>${c.desc}<br>Vida ${c.hp} · Vel. ${c.speed}</small></div>`).join('')}</div><button id="back">VOLTAR</button>`);document.querySelectorAll('[data-hero]').forEach(e=>e.onclick=()=>{let i=+e.dataset.hero;if(!save.unlocks.includes(i)){let cost=[0,300,500,700,900][i];if(save.coins<cost){toast('Moedas insuficientes');return}save.coins-=cost;save.unlocks.push(i);persist()}heroMenu()});$('back').onclick=menu}
function upgradeMenu(){let names={health:'Vida máxima',damage:'Poder de ataque',speed:'Velocidade',luck:'Sorte',magnet:'Coleta',cooldown:'Recarga',armor:'Armadura',regen:'Regeneração'};panel(`<h2>APRIMORAMENTOS PERMANENTES</h2><p class="muted">Invista moedas para fortalecer todas as próximas expedições.</p><div class="cards">${Object.entries(names).map(([k,n])=>`<div class="choice"><strong>${n}</strong><small>Nível ${save.upgrades[k]||0} · Custo ${100+((save.upgrades[k]||0)*75)}</small><button data-up="${k}" style="margin-top:12px;width:100%">MELHORAR</button></div>`).join('')}</div><button id="back">VOLTAR</button>`);document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let k=b.dataset.up,l=save.upgrades[k]||0,c=100+l*75;if(save.coins<c){toast('Moedas insuficientes');return}save.coins-=c;save.upgrades[k]=l+1;persist();upgradeMenu()});$('back').onclick=menu}
function recordMenu(){panel(`<h2>REGISTROS</h2><div class="section"><p>Partidas: ${save.runs}</p><p>Eliminações totais: ${save.totalKills}</p><p>Melhor tempo: ${fmt(save.best)}</p><p>Moedas disponíveis: ${save.coins}</p></div><button id="back">VOLTAR</button>`);$('back').onclick=menu}
function startGame(map=0,hero=0){let unlocked=save.unlocks;hero=unlocked.includes(hero)?hero:unlocked[0];let c=chars[hero],u=save.upgrades;g={map,hero,elapsed:0,x:0,y:0,hp:c.hp*(1+(u.health||0)*.06),maxHp:c.hp*(1+(u.health||0)*.06),speed:c.speed*(1+(u.speed||0)*.035),damage:c.power*(1+(u.damage||0)*.06),armor:(u.armor||0)*.025,regen:(u.regen||0)*.12,magnet:95+(u.magnet||0)*18,level:1,xp:0,xpNeed:8,kills:0,damageDone:0,coins:0,weaponLevels:{0:1},passives:{},cooldowns:{},enemies:[],shots:[],drops:[],particles:[],floaters:[],spawn:0,spawnRate:1.15,moveX:0,moveY:0,invuln:0,boss:null,paused:false,quality:1,chosen:hero};state='game';hidePanel();$('hud').style.display='block';$('joystick').style.display='block';audioInit();last=performance.now();requestAnimationFrame(loop)}
function fmt(t){let m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawnEnemy(){if(g.enemies.length>240)return;let ang=rand(0,Math.PI*2),r=Math.max(W,H)*.42+24,x=g.x+Math.cos(ang)*r,y=g.y+Math.sin(ang)*r;let t=Math.min(enemyTypes.length-1,Math.floor(rand(0,Math.min(9+g.elapsed/65,15))));let e=enemyTypes[t],factor=1+g.elapsed/210;e={type:t,name:e[0],kind:e[1],hp:e[2]*factor,max:e[2]*factor,speed:e[3]*(1+g.elapsed/1200),dmg:e[4]*factor,color:e[5],x,y,r:e[1]==='tank'||e[1]==='elite'?18:12,hit:0,attack:rand(1,3),phase:rand(0,6)};g.enemies.push(e)}
function drop(x,y,type='xp',value=1){g.drops.push({x,y,type,value,r:type==='coin'?5:4,life:30})}
function fireWeapon(id){let lv=g.weaponLevels[id],w=weapons[id],cd=w[3]*(1-(save.upgrades.cooldown||0)*.025);if(g.cooldowns[id]>0)return;g.cooldowns[id]=Math.max(.22,cd*(1-(g.passives.cooldown||0)*.06));let target=null,best=Infinity;for(let e of g.enemies){let d=dist(e,g);if(d<best){best=d;target=e}}let dmg=w[2]*g.damage*(1+(lv-1)*.25)*(g.passives.damage?1.12:1);let color=w[4];
if(id===0||id===4||id===6){for(let n=0;n<(id===6?3+Math.floor(lv/3):1);n++){let a=(g.elapsed*2+n*Math.PI*2/(id===6?3+Math.floor(lv/3):1));let x=g.x+Math.cos(a)*(id===6?65:42),y=g.y+Math.sin(a)*(id===6?65:42);areaHit(x,y,id===4?62:35,dmg*(id===6?.8:1),color)}}
else if(id===3||id===7||id===11){let x=target?target.x:g.x+rand(-150,150),y=target?target.y:g.y+rand(-150,150);areaHit(x,y,id===3?105:id===7?125:80,dmg,color);for(let i=0;i<18;i++)particle(x,y,color)}
else if(id===8){if(target){let e=target;for(let n=0;n<Math.min(3+lv,7);n++){let near=g.enemies.filter(a=>dist(a,e)<130).sort((a,b)=>dist(a,e)-dist(b,e))[n];if(near)damageEnemy(near,dmg*.75,color);else break}particle(e.x,e.y,color,12)}}
else{let count=id===2?1+Math.floor(lv/3):id===5?1+Math.floor(lv/2):id===9?2+Math.floor(lv/2):1+Math.floor(lv/3);for(let n=0;n<count;n++){let a=target?Math.atan2(target.y-g.y,target.x-g.x):rand(0,6.28);a+=rand(-.22,.22);let sp=id===2?270:390;g.shots.push({x:g.x,y:g.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.4,r:id===2?8:5,dmg,color,weapon:id,pierce:id===5?3:1})}}
}
function areaHit(x,y,r,dmg,color){for(let e of g.enemies)if(Math.hypot(e.x-x,e.y-y)<r+e.r)damageEnemy(e,dmg,color);if(g.boss&&Math.hypot(g.boss.x-x,g.boss.y-y)<r+g.boss.r){g.boss.hp-=dmg;g.damageDone+=dmg;g.boss.hit=.12}particle(x,y,color,20);g.floaters.push({x,y:y-r*.3,text:'✦',life:.5,color})}
function damageEnemy(e,dmg,color){if(e.hp<=0)return;e.hp-=dmg;g.damageDone+=dmg;e.hit=.12;particle(e.x,e.y,color,3);if(e.hp<=0){e.hp=0;g.kills++;drop(e.x,e.y,'xp',e.kind==='elite'?4:1);if(Math.random()<.13)drop(e.x+8,e.y+8,'coin',1);if(e.kind==='explosive')areaHit(e.x,e.y,70,35,'#ff8654')}}
function particle(x,y,color,n=6){for(let i=0;i<n&&g.particles.length<600;i++){let a=rand(0,6.28),s=rand(20,170);g.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.18,.65),max:.65,color,size:rand(2,5)})}}
function levelUp(){g.level++;g.xp-=g.xpNeed;g.xpNeed=Math.floor(g.xpNeed*1.32+3);state='level';g.paused=true;let opts=[];let owned=Object.keys(g.weaponLevels).map(Number);for(let n=0;n<3;n++){let pool=[];if(owned.length<6)pool.push(...weapons.map((w,i)=>({kind:'weapon',id:i,name:w[0],desc:w[1],level:g.weaponLevels[i]||0})).filter(x=>x.level<8));pool.push(...passives.map((p,i)=>({kind:'passive',id:i,name:p[0],desc:p[1],level:g.passives[i]||0})).filter(x=>x.level<5));let x=pool[Math.floor(Math.random()*pool.length)];if(x&&!opts.some(o=>o.name===x.name))opts.push(x)}while(opts.length<3)opts.push({kind:'stat',id:0,name:'Essência Vital',desc:'Recupere 25% da vida máxima.',level:0});panel(`<div class="rarity">NÍVEL ${g.level} ALCANÇADO</div><h2>ESCOLHA SUA EVOLUÇÃO</h2><p class="muted">O tempo parou. Escolha com sabedoria.</p><div class="cards">${opts.map((o,i)=>`<div class="choice" data-choice="${i}"><div class="rarity">${o.kind==='weapon'?'ARMA':o.kind==='passive'?'RELÍQUIA':'BÊNÇÃO'} · ${o.level?'APRIMORAMENTO':'NOVO'}</div><strong>${o.name}</strong><small>${o.desc}<br>${o.level?'Nível atual '+o.level:''}</small></div>`).join('')}</div>`);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let o=opts[+b.dataset.choice];if(o.kind==='weapon')g.weaponLevels[o.id]=(g.weaponLevels[o.id]||0)+1;else if(o.kind==='passive')g.passives[o.id]=(g.passives[o.id]||0)+1;else g.hp=Math.min(g.maxHp,g.hp+g.maxHp*.25);state='game';g.paused=false;hidePanel();last=performance.now()})}
function bossSpawn(){g.boss={x:g.x+Math.cos(1)*430,y:g.y+Math.sin(1)*430,hp:650+g.elapsed*1.8,max:650+g.elapsed*1.8,r:48,speed:48,attack:2,phase:0,hit:0};$('bossbar').style.display='block';toast('O DEVORADOR ANCESTRAL DESPERTOU')}
function update(dt){if(!g||g.paused)return;g.elapsed+=dt;g.invuln=Math.max(0,g.invuln-dt);for(let k in g.cooldowns)g.cooldowns[k]-=dt;
let dx=joy.x,dy=joy.y;if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;let mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag}const inputSmooth=Math.min(1,dt*14);g.moveX+=(dx-g.moveX)*inputSmooth;g.moveY+=(dy-g.moveY)*inputSmooth;g.x+=g.moveX*g.speed*dt;g.y+=g.moveY*g.speed*dt;
g.spawn-=dt;if(g.spawn<=0){spawnEnemy();g.spawn=Math.max(.15,g.spawnRate*(1-g.elapsed/1000))}if(g.elapsed>=600&&!g.boss)bossSpawn();
for(let e of g.enemies){if(e.hp<=0)continue;let a=Math.atan2(g.y-e.y,g.x-e.x),speed=e.speed;if(e.kind==='ranged'){e.attack-=dt;if(dist(e,g)<280&&dist(e,g)>150){e.x+=Math.cos(a+Math.PI/2)*speed*.45*dt;e.y+=Math.sin(a+Math.PI/2)*speed*.45*dt}else{e.x+=Math.cos(a)*speed*.35*dt;e.y+=Math.sin(a)*speed*.35*dt}if(e.attack<=0&&dist(e,g)<340){e.attack=2.2;g.shots.push({x:e.x,y:e.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,life:2,r:6,dmg:e.dmg,enemy:true,color:'#c58bd1'})}}else{e.x+=Math.cos(a)*speed*dt;e.y+=Math.sin(a)*speed*dt}if(dist(e,g)<e.r+15&&g.invuln<=0){g.hp-=Math.max(1,e.dmg*(1-g.armor))*dt*1.5;g.invuln=.3;particle(g.x,g.y,'#ff687c',5)}}
if(g.boss){let b=g.boss,a=Math.atan2(g.y-b.y,g.x-b.x);b.x+=Math.cos(a)*b.speed*dt;b.y+=Math.sin(a)*b.speed*dt;b.attack-=dt;if(b.attack<=0){b.attack=2.4;b.phase++;for(let i=0;i<8;i++){let an=i*Math.PI/4;g.shots.push({x:b.x,y:b.y,vx:Math.cos(an)*155,vy:Math.sin(an)*155,life:2.5,r:9,dmg:24,enemy:true,color:'#e66cae'})}}if(dist(b,g)<b.r+16&&g.invuln<=0){g.hp-=22*dt;g.invuln=.3}if(b.hp<=0){g.boss=null;$('bossbar').style.display='none';g.coins+=350;toast('CHEFE DERROTADO · +350 MOEDAS');for(let i=0;i<50;i++)particle(b.x,b.y,'#ffd27a',1)}}
for(let s of g.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(!s.enemy){for(let e of g.enemies){if(e.hp>0&&Math.hypot(e.x-s.x,e.y-s.y)<e.r+s.r){damageEnemy(e,s.dmg,s.color);s.pierce--;if(s.pierce<=0){s.life=0;break}}if(g.boss&&Math.hypot(g.boss.x-s.x,g.boss.y-s.y)<g.boss.r+s.r){g.boss.hp-=s.dmg;g.damageDone+=s.dmg;s.life=0}}}else if(Math.hypot(g.x-s.x,g.y-s.y)<18+s.r&&g.invuln<=0){g.hp-=s.dmg*(1-g.armor);g.invuln=.4;s.life=0}}
for(let d of g.drops){d.life-=dt;let dd=Math.hypot(g.x-d.x,g.y-d.y);if(dd<g.magnet){let a=Math.atan2(g.y-d.y,g.x-d.x),v=260*(1-dd/g.magnet*.5);d.x+=Math.cos(a)*v*dt;d.y+=Math.sin(a)*v*dt}if(dd<19){if(d.type==='xp'){g.xp+=d.value;if(g.xp>=g.xpNeed){levelUp();break}}else g.coins+=d.value;d.life=0}}
for(let p of g.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.96;p.vy*=.96}for(let f of g.floaters)f.life-=dt;
g.enemies=g.enemies.filter(e=>e.hp>0);g.shots=g.shots.filter(s=>s.life>0);g.drops=g.drops.filter(d=>d.life>0);g.particles=g.particles.filter(p=>p.life>0);g.floaters=g.floaters.filter(p=>p.life>0);
if(g.regen)g.hp=Math.min(g.maxHp,g.hp+g.regen*dt);for(let i=0;i<12;i++)if(g.weaponLevels[i])fireWeapon(i);
if(g.hp<=0){g.hp=0;finishGame();return}updateHud()}
function updateHud(){$('health').textContent=Math.ceil(g.hp)+'/'+Math.ceil(g.maxHp);$('clock').textContent=fmt(g.elapsed);$('level').textContent=g.level;$('kills').textContent=g.kills;$('hpfill').style.width=100*g.hp/g.maxHp+'%';$('xpfill').style.width=100*g.xp/g.xpNeed+'%';if(g.boss)$('bossfill').style.width=100*g.boss.hp/g.boss.max+'%'}

function drawSprite(x,y,type,color,frame=0,sz=1){ctx.save();ctx.translate(x,y);ctx.scale(sz,sz);ctx.fillStyle='#0006';ctx.fillRect(-11,12,22,4);
let pix=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
if(type==='player'){pix(-7,-12,14,17,'#26374e');pix(-5,-15,10,9,'#d8b28c');pix(-7,-19,14,6,'#e4d7bc');pix(-10,-6,4,10,'#68c8c8');pix(6,-6,4,10,'#68c8c8');pix(-5,4,4,9,'#e0c18b');pix(2,4,4,9,'#e0c18b');pix(7,-8,4,3,'#8df3f2');pix(-2,-5,3,3,'#263044')}
else if(type==='boss'){pix(-28,-23,56,42,'#44213d');pix(-21,-31,42,18,'#8b3b65');pix(-35,-15,13,24,'#612c50');pix(22,-15,13,24,'#612c50');pix(-17,-12,10,7,'#ffdc8a');pix(8,-12,10,7,'#ffdc8a');pix(-8,0,16,7,'#1b1727');pix(-8,-36,7,15,'#b36a8d');pix(2,-36,7,15,'#b36a8d')}
else{let s=type%5;pix(-10,-9,20,19,color);if(s===0){pix(-7,-14,14,7,color);pix(-6,-4,4,4,'#ffe7a0');pix(3,-4,4,4,'#ffe7a0');pix(-8,9,5,6,'#42534d');pix(4,9,5,6,'#42534d')}if(s===1){pix(-14,-5,7,13,color);pix(7,-5,7,13,color);pix(-5,-13,4,4,'#ffdfab');pix(3,-13,4,4,'#ffdfab')}if(s===2){pix(-14,-12,28,24,color);pix(-6,-17,12,8,'#5b3c45');pix(-7,-4,4,4,'#ffd5a0');pix(4,-4,4,4,'#ffd5a0')}if(s===3){pix(-14,-2,7,9,color);pix(7,-2,7,9,color);pix(-4,-15,8,7,'#d4c5ee');pix(-5,-5,3,3,'#fff')}if(s===4){pix(-12,-13,24,7,color);pix(-5,-4,4,5,'#ffe8a2');pix(3,-4,4,5,'#ffe8a2');pix(-8,10,5,5,'#6a3c35');pix(4,10,5,5,'#6a3c35')}}
ctx.restore()}
function render(){if(!g)return;let camX=g.x,camY=g.y;ctx.fillStyle=maps[g.map].bg;ctx.fillRect(0,0,W,H);let tile=64,ox=((W/2-camX)%tile),oy=((H/2-camY)%tile);ctx.save();ctx.translate(ox,oy);for(let x=-tile;x<W+tile;x+=tile)for(let y=-tile;y<H+tile;y+=tile){let wx=Math.floor((x-ox+camX)/tile),wy=Math.floor((y-oy+camY)/tile);ctx.fillStyle=((wx+wy)%2===0)?maps[g.map].ground:maps[g.map].bg;ctx.fillRect(x,y,tile,tile);let seed=Math.abs((wx*73856093^wy*19349663)|0)%100;if(seed<12){ctx.fillStyle=maps[g.map].accent+'33';ctx.fillRect(x+seed%40,y+(seed*3)%45,3+seed%7,3+seed%5)}if(seed===18){ctx.fillStyle='#111a20aa';ctx.fillRect(x+15,y+12,24,35);ctx.fillStyle=maps[g.map].accent+'88';ctx.fillRect(x+19,y+17,4,25)}}ctx.restore();
let sx=x=>W/2+(x-camX),sy=y=>H/2+(y-camY);
for(let d of g.drops){ctx.fillStyle=d.type==='coin'?'#f6c95f':'#7de8f0';ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.save();ctx.translate(sx(d.x),sy(d.y));ctx.rotate(Math.PI/4);ctx.fillRect(-5,-5,10,10);ctx.restore();ctx.shadowBlur=0}
for(let e of g.enemies){let x=sx(e.x),y=sy(e.y);if(x<-80||x>W+80||y<-80||y>H+80)continue;drawSprite(x,y,e.type,e.color,0,e.r/13);if(e.hit>0){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x-e.r,y-e.r,e.r*2,e.r*2);e.hit-=.016}if(e.kind==='elite'){ctx.fillStyle='#160e18';ctx.fillRect(x-15,y-e.r-9,30,3);ctx.fillStyle='#d87592';ctx.fillRect(x-15,y-e.r-9,30*e.hp/e.max,3)}}
if(g.boss){drawSprite(sx(g.boss.x),sy(g.boss.y), 'boss','#8e3e71',0,1.8);ctx.strokeStyle='#ff9bd1';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx(g.boss.x),sy(g.boss.y),65,-Math.PI/2,-Math.PI/2+Math.PI*2*g.boss.hp/g.boss.max);ctx.stroke()}
for(let s of g.shots){const px=sx(s.x),py=sy(s.y),ang=Math.atan2(s.vy,s.vx);ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.globalAlpha=s.enemy?.9:1;ctx.shadowBlur=s.enemy?15:22;ctx.shadowColor=s.color;ctx.fillStyle=s.color;ctx.beginPath();ctx.ellipse(0,0,s.enemy?Math.max(7,s.r*1.8):Math.max(9,s.r*2.8),s.enemy?Math.max(4,s.r*.8):Math.max(4,s.r*.9),0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.45;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.ellipse(-3,0,Math.max(3,s.r*.9),Math.max(2,s.r*.35),0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.globalAlpha=1;ctx.shadowBlur=0}
drawSprite(W/2,H/2,'player','#5bc6c5');for(let p of g.particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(sx(p.x),sy(p.y),p.size,p.size)}ctx.globalAlpha=1;
ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';for(let f of g.floaters){ctx.globalAlpha=f.life*2;ctx.fillText(f.text,sx(f.x),sy(f.y));}ctx.globalAlpha=1;
if(g.boss){ctx.fillStyle='#f7c66a';ctx.font='bold 12px system-ui';ctx.fillText('O DEVORADOR ANCESTRAL',W/2,H-20)}
}
function finishGame(){state='result';g.paused=true;let reward=Math.floor(g.elapsed/12)+Math.floor(g.kills/5)+g.coins;save.coins+=reward;save.runs++;save.totalKills+=g.kills;save.best=Math.max(save.best,g.elapsed);persist();$('hud').style.display='none';$('joystick').style.display='none';panel(`<div class="rarity">FIM DA EXPEDIÇÃO</div><h2>${g.boss===null&&g.elapsed>=600?'A NOITE FOI SOBREVIVIDA':'A ESCURIDÃO VENCEU'}</h2><div class="logo" style="font-size:38px;color:#f5ca77">${fmt(g.elapsed)}</div><div class="cards"><div class="choice"><strong>${g.kills}</strong><small>Inimigos eliminados</small></div><div class="choice"><strong>${g.level}</strong><small>Nível alcançado</small></div><div class="choice"><strong>${Math.floor(g.damageDone)}</strong><small>Dano causado</small></div><div class="choice"><strong>+${reward}</strong><small>Moedas recebidas</small></div></div><button class="primary" id="again">JOGAR NOVAMENTE</button><button id="home">MENU PRINCIPAL</button>`);$('again').onclick=()=>startGame(g.map,g.hero);$('home').onclick=menu}
function loop(t){if(state!=='game')return;let dt=(t-last)/1000||0;last=t;dt=Math.max(0,Math.min(.05,dt));update(dt);render();if(state==='game')requestAnimationFrame(loop)}
let audio=null,master=null;function audioInit(){try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.07;master.connect(audio.destination)}audio.resume()}catch(e){}}
function sound(freq=440,dur=.08,type='sine'){if(!audio)return;let o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.value=freq;v.gain.setValueAtTime(.1,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v);v.connect(master);o.start();o.stop(audio.currentTime+dur)}
// Touch joystick, keyboard and pause.
let joyEl=$('joystick'),stick=$('stick');function setJoy(e){let r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),lim=35;if(len>lim){dx=dx/len*lim;dy=dy/len*lim}joy.x=dx/lim;joy.y=dy/lim;stick.style.transform=`translate(${dx}px,${dy}px)`}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joy.active=true;setJoy(e);try{joyEl.setPointerCapture(e.pointerId)}catch(err){}});joyEl.addEventListener('pointermove',e=>{if(joy.active)setJoy(e)});function joyEnd(){joy.active=false;joy.x=joy.y=0;stick.style.transform=''}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
// Fallback de movimentação: arraste em qualquer ponto da metade esquerda da tela.
let dragPointer=null,dragX=0,dragY=0;
document.addEventListener('pointerdown',e=>{if(state!=='game'||e.clientX>W*.55||joyEl.contains(e.target))return;dragPointer=e.pointerId;dragX=e.clientX;dragY=e.clientY;joy.active=true;joy.x=joy.y=0;});
document.addEventListener('pointermove',e=>{if(dragPointer!==e.pointerId)return;let dx=e.clientX-dragX,dy=e.clientY-dragY,len=Math.hypot(dx,dy),lim=58;if(len>lim){dx=dx/len*lim;dy=dy/len*lim}joy.x=dx/lim;joy.y=dy/lim;});
function endDrag(e){if(dragPointer===e.pointerId){dragPointer=null;joyEnd()}}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Escape'&&state==='game')pauseGame()});addEventListener('keyup',e=>keys[e.key]=false);
function pauseGame(){if(state!=='game')return;state='pause';g.paused=true;panel(`<h2>EXPEDIÇÃO PAUSADA</h2><p class="muted">${fmt(g.elapsed)} · Nível ${g.level}</p><button class="primary" id="resume">CONTINUAR</button><button id="quit">ABANDONAR PARTIDA</button>`);$('resume').onclick=()=>{state='game';g.paused=false;hidePanel();last=performance.now();requestAnimationFrame(loop)};$('quit').onclick=finishGame}
canvas.addEventListener('pointerdown',()=>{if(state==='game'&&g.elapsed<.1)sound(520,.1)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='game')pauseGame()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
menu();
})();
</script></body></html>
